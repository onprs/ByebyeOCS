          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - adminCookie: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /admin/api/v1/data-requests/{id}/review:
    post:
      operationId: reviewDeletionRequest
      tags:
      - admin-operations
      summary: 复核删除申请（新鲜验证）
      responses:
        '200':
          description: 复核动作已完成；defer/reject 不关闭账号，complete 关闭账号并清理会话与主体密文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataReviewResult'
        '409':
          description: 存在未结资金或运行中活动，删除未完成；申请保留在 needs_review 并标记 closure_blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
                  blockers:
                    $ref: '#/components/schemas/PrivacyBlockers'
                additionalProperties: false
                required:
                - error
                - blockers
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - adminCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/AdminCsrf'
      - $ref: '#/components/parameters/AdminOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataReviewInput'
  /api/v1/events:
    get:
      operationId: streamUserEvents
      tags:
      - user-events
      summary: 用户实时事件流
      responses:
        '200':
          description: 'Server-Sent Events。每帧为 event: <type> / data: <JSON>；已提供 id 的事件可通过 Last-Event-ID 续传。'
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
            X-Accel-Buffering:
              schema:
                type: string
              description: 'no'
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 文本流，不是单一 JSON 对象
              example: 'id: 42

                event: task.state_changed

                data: {"event_id":"...","resource_id":"...","resource_version":3,"data":{"state":"running"}}


                '
          x-sse:
            eventTypes:
            - connected
            - heartbeat
            - reauth_required
            - task.state_changed
            - task.claimed
            - task.attempt_finished
            - task.control_applied
            - task.control_accepted
            - task.confirmed
            - task.recovery_verification
            - task.platform_confirmed_after_cancel
            - plan.revised
            - plan.control_applied
            - account.operation_applied
            - wallet.updated
            - order.updated
            - question.query.updated
            - question.cache.invalidated
            - privacy.deletion_requested
            - watermark
            connectedData:
              watermark: string
              resync_snapshot: true
            heartbeatData:
              time: RFC3339
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      description: 未带游标时从当前水位开始；带游标时补发缺失事件。游标过期返回 409 resync_required，连接数超限返回 429 并带 Retry-After。
      security:
      - userCookie: []
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/SseCursor'
      - $ref: '#/components/parameters/LastEventId'
  /admin/api/v1/events:
    get:
      operationId: streamAdminEvents
      tags:
      - admin-events
      summary: 管理员实时事件流
      responses:
        '200':
          description: 'Server-Sent Events。每帧为 event: <type> / data: <JSON>；已提供 id 的事件可通过 Last-Event-ID 续传。'
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
            X-Accel-Buffering:
              schema:
                type: string
              description: 'no'
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 文本流，不是单一 JSON 对象
              example: 'id: 42

                event: task.state_changed

                data: {"event_id":"...","resource_id":"...","resource_version":3,"data":{"state":"running"}}


                '
          x-sse:
            eventTypes:
            - connected
            - heartbeat
            - reauth_required
            - task.state_changed
            - task.claimed
            - task.attempt_finished
            - task.control_applied
            - task.control_accepted
            - task.confirmed
            - task.recovery_verification
            - task.platform_confirmed_after_cancel
            - plan.revised
            - plan.control_applied
            - account.operation_applied
            - wallet.updated
            - order.updated
            - question.query.updated
            - question.cache.invalidated
            - privacy.deletion_requested
            - watermark
            connectedData:
              watermark: string
              resync_snapshot: true
            heartbeatData:
              time: RFC3339
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      description: 仅管理员 audience 的事件；按角色过滤。游标过期返回 409 resync_required，连接数超限返回 429。
      security:
      - adminCookie: []
      parameters:
      - $ref: '#/components/parameters/SseCursor'
      - $ref: '#/components/parameters/LastEventId'
components:
  securitySchemes:
    userCookie:
      type: apiKey
      in: cookie
      name: bbo_user_session
      description: 用户 Web 会话 Cookie；HttpOnly、SameSite=Lax。写请求需 Origin 与 X-CSRF-Token。
    adminCookie:
      type: apiKey
      in: cookie
      name: bbo_admin_session
      description: 管理员 Web 会话 Cookie；HttpOnly、SameSite=Lax。写请求需 Origin 与 X-CSRF-Token。
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque access token
      description: 用户 App 的 Bearer access token；不使用 Cookie，也不需要 CSRF。
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        description: 每页数量，实际默认值由服务决定，通常为 20，最大 100
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        description: 服务端不透明分页游标；不要解析或构造
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        description: 当前资源版本 ETag，格式为双引号包围的 vN，例如 "v3"
        pattern: ^"v[0-9]+"$
      description: 并发修改必须携带 GET 返回的 ETag（格式 "vN"）。缺失返回 428，版本过期返回 412。
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        description: 命令幂等键；同一请求重试复用，不同请求必须更换（不同服务接受长度 1–200）
        minLength: 1
        maxLength: 200
    AdminCsrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        description: 登录/step-up 或会话接口返回的 CSRF 令牌
      description: 管理员 Web Cookie 会话的所有非安全方法必填。
    UserCsrf:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        description: Web Cookie 会话的 CSRF 令牌
      description: 用户端使用 Cookie 会话时，所有非安全方法必填；App Bearer 会话不需要。
    AdminOrigin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        description: 管理员端配置的 Origin
      description: 管理员 Cookie 会话的写请求必须与配置的 AdminOrigin 完全匹配。
    UserOrigin:
      name: Origin
      in: header
      required: false
      schema:
        type: string
        description: 用户端配置的 Origin
      description: 用户端 Cookie 会话的写请求必须与配置的 UserOrigin 完全匹配；Bearer 请求不需要。
    AdminLoginOrigin:
      name: Origin
      in: header
      required: false
      schema:
        type: string
        description: 管理员端配置的 Origin
      description: 匿名登录如果携带 Origin，必须与 AdminOrigin 完全匹配；浏览器会自动发送。
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: integer
        description: 上一次收到的 SSE 事件序号
        minimum: 0
      description: 断线续传游标。也可通过 cursor 查询参数提供。
    SseCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: integer
        description: SSE 事件序号
        minimum: 0
      description: 与 Last-Event-ID 等价的游标；未提供时从当前水位开始。
    ChallengeBinding:
      name: X-Challenge-Binding
      in: header
      required: false
      schema:
        type: string
        description: 发起挑战时返回的 binding_token
      description: App 必须回传该绑定值；Web 使用 HttpOnly challenge cookie，不需要此头。
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        description: 按名称、学校或内部用户 UUID 搜索
        maxLength: 80
    States:
      name: state
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          description: 任务状态；可重复或逗号分隔
    CourseID:
      name: course_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    PlanIDFilter:
      name: plan_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    UserIDFilter:
      name: user_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    OfferingIDFilter:
      name: offering_id
      in: query
      required: false
      schema:
        type: string
        description: 公开模型 ID（qm_ 前缀）
        pattern: ^qm_[0-9a-f]{32}$
  responses:
    BadRequest:
      description: 请求格式无效或缺少必要内容
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未认证、会话失效或凭据无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 权限不足、CSRF/Origin 校验失败、需要 step-up 或角色不允许
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在，或对当前主体不可见
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 状态冲突、幂等键复用、余额不足或执行租约失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: 资源已过期或已不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VersionConflict:
      description: 版本已过期（version_conflict），需重新读取后重试
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: HTTP 方法不被该接口支持
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: 请求体不是 application/json，或无法格式化的字符集
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: 字段或查询参数不符合要求
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: 缺少 If-Match 版本条件，或未授权管理员付费模型测试（precondition_required / cost_confirmation_required）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 请求过于频繁；响应包含 Retry-After 秒数
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
          description: 建议重试等待秒数
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: 上游模型或外部平台返回了不可信任的响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 服务暂不可用、外部能力未配置或维护中
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: 上游模型超时，查询结果待核对
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 内部未预期错误；不泄露堆栈或上游原文
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
          - account_blocked
          - backup_unavailable
          - billing_review_required
          - cache_not_allowed
          - confirmation_required
          - conflict
          - content_expired
          - cost_confirmation_required
          - csrf_invalid
          - enrollment_failed
          - export_expired
          - export_not_ready
          - export_too_large
          - external_disabled
          - forbidden
          - idempotency_conflict
          - idempotency_required
          - identity_conflict
          - identity_fingerprint_invalid
          - identity_fingerprint_not_configured
          - identity_invalid
          - identity_not_linked
          - insufficient_balance
          - internal_error
          - invalid_fork_response
          - lease_lost
          - method_not_allowed
          - model_disabled
          - not_configured
          - not_found
          - platform_session_unavailable
          - privacy_blocked
          - platform_submission_unavailable
          - precondition_required
          - pricing_error
          - provider_unavailable
          - question_token_invalid
          - rate_limited
          - reauth_required
          - readiness_missing
          - recovery_required
          - request_in_progress
          - resync_required
          - service_stopping
          - service_unavailable
          - shared_cache_not_allowed
          - step_up_required
          - storage_pressure
          - sync_attempts_exhausted
          - unauthenticated
          - upstream_timeout
          - usage_incomplete
          - validation_failed
          - version_conflict
          - audit_write_failed
          - charging_setting_unavailable
          - event_write_failed
          - invalid_amount
          - invalid_credentials
          - origin_invalid
          - session_expired
          - unsupported_media_type
          - budget_exceeded
          - invalid_mode
          - invalid_question
          - invalid_scope
          - request_unknown
          - upstream_rate_limited
          - vision_unsupported
          - questions_policy_validator_not_configured
          description: 稳定错误码；内部异常统一为 internal_error
        message:
          type: string
          description: 面向用户的安全中文说明，不包含上游原文、凭据或堆栈
        request_id:
          type: string
          description: 服务端请求编号
          pattern: ^req_[0-9a-f]+$
        retryable:
          type: boolean
        scope:
          type: string
          description: 错误作用域，例如 request、account、service、provider
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      - retryable
      - scope
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: false
      required:
      - error
    Capabilities:
      type: object
      properties:
        api_version:
          type: string
          enum:
          - v1
        minimum_client_version:
          type: string
          nullable: true
        audience:
          type: string
          enum:
          - user
          - admin
        request_id:
          type: string
        authentication:
          type: object
          properties:
            enabled:
              type: boolean
            login_methods:
              type: array
              items:
                type: string
                enum:
                - password
                - totp
                - password+totp
          additionalProperties: false
          required:
          - enabled
          - login_methods
        features:
          type: object
          properties:
            course_sync:
              type: boolean
            scheduling:
              type: boolean
            task_execution:
              type: boolean
            wallet:
              type: boolean
            payments:
              type: boolean
            tiku:
              type: boolean
            preferences:
              type: boolean
            events:
              type: boolean
            questions:
              type: boolean
            learning:
              type: boolean
            billing:
              type: boolean
            operations:
              type: boolean
          additionalProperties: true
          required:
          - course_sync
          - scheduling
          - task_execution
          - wallet
          - payments
          - tiku
          - preferences
        appearance:
          type: object
          properties:
            default_color_scheme:
              type: string
              enum:
              - graphite
              - grove
              - indigo
            color_schemes:
              type: array
              items:
                type: string
                enum:
                - graphite
                - grove
                - indigo
              minItems: 3
              maxItems: 3
              uniqueItems: true
            default_theme_mode:
              type: string
              enum:
              - system
              - light
              - dark
            theme_modes:
              type: array
              items:
                type: string
                enum:
                - system
                - light
                - dark
              minItems: 3
              maxItems: 3
              uniqueItems: true
          additionalProperties: false
          required:
          - default_color_scheme
          - color_schemes
          - default_theme_mode
          - theme_modes
        pricing:
          type: object
          properties:
            service_configured:
              type: boolean
            tiku_configured:
              type: boolean
            automatic_charging:
              type: boolean
          additionalProperties: false
          required:
          - service_configured
          - tiku_configured
          - automatic_charging
        task_types:
          type: array
          description: 当前执行器支持的任务分类；执行是否启用由features.task_execution单独表示。
          items:
            type: object
            properties:
              id:
                type: string
                enum: [video, audio, document, quiz, other]
              name:
                type: string
              available:
                type: boolean
            required: [id, name, available]
            additionalProperties: false
        execution:
          type: object
          properties:
            platform_adapter:
              type: string
            course_read:
              type: boolean
            platform_check:
              type: boolean
            credential_verify:
              type: boolean
            execution_enabled:
              type: boolean
            executor:
              type: string
            executor_enabled:
              type: boolean
            task_kinds:
              type: array
              items:
                type: string
            media_evidence:
              type: boolean
            billing_connected:
              type: boolean
            session_resolver:
              type: boolean
            disabled_reasons:
              type: array
              items:
                type: string
          additionalProperties: false
          required:
          - platform_adapter
          - course_read
          - platform_check
          - credential_verify
          - execution_enabled
          - executor
          - executor_enabled
          - media_evidence
          - billing_connected
          - session_resolver
          - disabled_reasons
      additionalProperties: false
      required:
      - api_version
      - minimum_client_version
      - audience
      - request_id
      - authentication
      - features
      - appearance
      - pricing
    AuthCapabilities:
      type: object
      properties:
        identity:
          type: object
          properties:
            provider:
              type: string
              description: 固定为 chaoxing
            methods:
              type: array
              items:
                type: string
                enum:
                - password
            qr_scan:
              type: boolean
            verification:
              type: string
              enum:
              - configured
              - disabled
          additionalProperties: false
          required:
          - provider
          - methods
          - qr_scan
          - verification
        admin:
          type: object
          properties:
            methods:
              type: array
              items:
                type: string
                enum:
                - password+totp
            rbac:
              type: boolean
            roles:
              type: array
              items:
                type: string
                enum:
                - owner
                - operator
                - support
                - finance
                - observer
            step_up:
              type: boolean
            owner_id:
              type: string
              description: '* 表示 owner 通配权限'
          additionalProperties: false
          required:
          - methods
          - rbac
          - roles
          - step_up
          - owner_id
        web_cookie:
          type: boolean
        app_bearer:
          type: boolean
        refresh_rotation:
          type: boolean
        totp:
          type: boolean
      additionalProperties: false
      required:
      - identity
      - admin
      - web_cookie
      - app_bearer
      - refresh_rotation
      - totp
    RuntimeCapabilities:
      type: object
      properties:
        platform_adapter:
          type: string
        course_read:
          type: boolean
        platform_check:
          type: boolean
        credential_verify:
          type: boolean
        execution_enabled:
          type: boolean
        executor:
          type: string
        executor_enabled:
          type: boolean
        task_kinds:
          type: array
          items:
            type: string
        media_evidence:
          type: boolean
        billing_connected:
          type: boolean
        session_resolver:
          type: boolean
        disabled_reasons:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
      - platform_adapter
      - course_read
      - platform_check
      - credential_verify
      - execution_enabled
      - executor
      - executor_enabled
      - media_evidence
      - billing_connected
      - session_resolver
      - disabled_reasons
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
        request_id:
          type: string
      additionalProperties: false
      required:
      - status
      - request_id
    SessionView:
      type: object
      properties:
        channel:
          type: string
          enum:
          - web
          - app
        expires_at:
