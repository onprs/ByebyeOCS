  /payments/callbacks/zpay:
    get:
      operationId: zpayCallbackGet
      tags:
      - payments
      summary: ZPay 异步通知（GET 形式）
      responses:
        '200':
          description: 通知已验签并按幂等订单处理
          content:
            text/plain:
              schema:
                type: string
                description: 纯文本 success（可能带换行）
        '400':
          description: 通知无效或验签失败
          content:
            text/plain:
              schema:
                type: string
                description: 纯文本 invalid（可能带换行）
        '503':
          description: 暂时无法处理，请支付平台稍后重试
          content:
            text/plain:
              schema:
                type: string
                description: 纯文本 retry（可能带换行）
      description: 该端点为供应商回调，不是 JSON 错误契约；成功返回纯文本 success，无效返回 invalid（400），暂时不可用返回 retry（503）。签名覆盖除 sign/sign_type 外的有效参数。
      security: []
      parameters:
      - name: pid
        in: query
        required: true
        schema:
          type: string
          description: ZPay 商户 ID
      - name: trade_no
        in: query
        required: true
        schema:
          type: string
          description: ZPay 交易号
      - name: out_trade_no
        in: query
        required: true
        schema:
          type: string
          description: 商户订单号
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - alipay
          - wxpay
      - name: name
        in: query
        required: false
        schema:
          type: string
          description: 商品名称
      - name: money
        in: query
        required: true
        schema:
          type: string
          description: 支付金额，十进制字符串
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
      - name: trade_status
        in: query
        required: true
        schema:
          type: string
          enum:
          - TRADE_SUCCESS
          - TRADE_CLOSED
      - name: sign
        in: query
        required: true
        schema:
          type: string
          description: ZPay 异步通知签名
      - name: sign_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - MD5
    post:
      operationId: zpayCallbackPost
      tags:
      - payments
      summary: ZPay 异步通知（POST 表单）
      responses:
        '200':
          description: 通知已验签并按幂等订单处理
          content:
            text/plain:
              schema:
                type: string
                description: 纯文本 success（可能带换行）
        '400':
          description: 通知无效或验签失败
          content:
            text/plain:
              schema:
                type: string
                description: 纯文本 invalid（可能带换行）
        '503':
          description: 暂时无法处理，请支付平台稍后重试
          content:
            text/plain:
              schema:
                type: string
                description: 纯文本 retry（可能带换行）
      description: 成功返回纯文本 success；无效返回 invalid（400）；暂时不可用返回 retry（503）。该端点不使用 Cookie/Bearer 或 JSON 错误包。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ZpayNotification'
        description: 表单编码的 ZPay 通知；签名与其他字段同 GET。
