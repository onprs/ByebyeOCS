openapi: 3.0.3
info:
  title: ByebyeOCS 正式 API
  version: 0.3.0
  description: '用户端与管理员端的当前实现契约。用户端路径前缀 /api/v1，管理员端前缀 /admin/api/v1；两端由入口严格分离监听。


    认证：用户 Web 使用 bbo_user_session HttpOnly Cookie，管理员 Web 使用 bbo_admin_session；用户 App 使用 Bearer access token 与轮换 refresh token。Cookie
    会话的所有非安全方法必须携带匹配 Origin 和 X-CSRF-Token；Bearer 会话不使用 Cookie 与 CSRF。管理员敏感操作还要求通过 /admin/api/v1/auth/step-up 获得新鲜验证。


    并发与幂等：偏好、安排和计费设置使用 ETag/If-Match（格式 "vN"）；缺失返回 428，版本过期返回 412。命令接口要求 Idempotency-Key，相同键只允许相同请求；复用于不同请求返回 409 idempotency_conflict。


    数据格式：金额字段为整数最小货币单位字符串（人民币分），题库 token 单价为整数微元字符串；时间均为 UTC RFC3339。列表使用 cursor/limit；分页响应具体是否省略空 next_cursor 由各服务实际响应决定。


    错误统一为 {error:{code,message,request_id,retryable,scope}}；支付供应商回调是唯一例外，使用纯文本 success/invalid/retry。SSE 端点返回 text/event-stream，事件数据见响应说明与
    x-sse 扩展。'
servers:
- url: /
  description: 同源部署；用户端与管理员端由入口严格分离监听
tags:
- name: capabilities
  description: 能力发现与端类型声明
- name: health
  description: 管理员监听器健康检查
- name: user-auth
  description: 用户端认证与会话（Cookie 或 Bearer）
- name: user-profile
  description: 用户自助资料、设备与偏好
- name: user-learning
  description: 用户课程、安排、任务
- name: user-finance
  description: 用户钱包、价格、用量与充值订单
- name: user-questions
  description: 用户题库查询与反馈
- name: user-privacy
  description: 用户数据导出与删除申请
- name: user-events
  description: 用户 SSE 事件流
- name: admin-auth
  description: 管理员独立认证与新鲜验证
- name: admin-profile
  description: 管理员自助资料、设备与偏好
- name: admin-users
  description: 管理员账号和角色管理
- name: admin-learning
  description: 管理员运行总览、账号与任务
- name: admin-finance
  description: 管理员订单、钱包、对账、退款与计费
- name: admin-questions
  description: 管理员模型、用量、查询与缓存
- name: admin-operations
  description: 管理员审计、运行维护和隐私复核
- name: admin-events
  description: 管理员 SSE 事件流
- name: payments
  description: ZPay 异步通知
security: []
paths:
  /api/v1/capabilities:
    get:
      operationId: getUserCapabilities
      tags:
      - capabilities
      summary: 获取用户端能力与外观选项
      responses:
        '200':
          description: 服务能力与外观选项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
    head:
      operationId: headUserCapabilities
      tags:
      - capabilities
      summary: 检查用户端能力接口可达性
      responses:
        '200':
          description: 能力接口可达
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /admin/api/v1/capabilities:
    get:
      operationId: getAdminCapabilities
      tags:
      - capabilities
      summary: 获取管理员端能力与外观选项
      responses:
        '200':
          description: 服务能力与外观选项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
    head:
      operationId: headAdminCapabilities
      tags:
      - capabilities
      summary: 检查管理员端能力接口可达性
      responses:
        '200':
          description: 能力接口可达
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /health/live:
    get:
      operationId: getLiveness
      tags:
      - health
      summary: 存活检查
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
    head:
      operationId: headLiveness
      tags:
      - health
      summary: 存活检查（无响应体）
      responses:
        '200':
          description: 服务存活
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /health/ready:
    get:
      operationId: getReadiness
      tags:
      - health
      summary: 就绪检查
      responses:
        '200':
          description: 服务已就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
    head:
      operationId: headReadiness
      tags:
      - health
      summary: 就绪检查（无响应体）
      responses:
        '200':
          description: 服务已就绪
        '503':
          description: 服务未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /api/v1/auth/chaoxing/challenges:
    post:
      operationId: createUserLoginChallenge
      tags:
      - user-auth
      summary: 发起学习通登录挑战
      responses:
        '201':
          description: 挑战已创建；Web 同时设置 challenge cookie
          headers:
            Set-Cookie:
              description: HttpOnly、SameSite=Lax 的会话 Cookie；Web 登录/刷新/登出时设置或清除
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: 通常为 no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeCreateResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      parameters:
      - $ref: '#/components/parameters/UserOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCreateRequest'
  /api/v1/auth/chaoxing/challenges/{id}:
    get:
      operationId: getUserLoginChallenge
      tags:
      - user-auth
      summary: 读取登录挑战状态
      responses:
        '200':
          description: 挑战当前状态
          headers:
            Cache-Control:
              schema:
                type: string
              description: 通常为 no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/ChallengeBinding'
      - $ref: '#/components/parameters/UserOrigin'
  /api/v1/auth/chaoxing/challenges/{id}/verify:
    post:
      operationId: verifyUserLoginChallenge
      tags:
      - user-auth
      summary: 提交学习通凭据并建立会话
      responses:
        '200':
          description: 登录成功；Web 设置 HttpOnly Cookie，App 返回 Bearer 令牌
          headers:
            Set-Cookie:
              description: HttpOnly、SameSite=Lax 的会话 Cookie；Web 登录/刷新/登出时设置或清除
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: 通常为 no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/ChallengeBinding'
      - $ref: '#/components/parameters/UserOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeVerifyRequest'
  /api/v1/auth/refresh:
    post:
      operationId: refreshUserSession
      tags:
      - user-auth
      summary: 轮换用户端会话
      responses:
        '200':
          description: 轮换后的 Web Cookie 或 App 新令牌
          headers:
            Set-Cookie:
              description: HttpOnly、SameSite=Lax 的会话 Cookie；Web 登录/刷新/登出时设置或清除
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: 通常为 no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      description: App 刷新只需 refresh_token，不需要 Cookie/CSRF；Web Cookie 轮换若携带已认证 Cookie，仍须匹配 Origin 与 X-CSRF-Token。
      security: []
      parameters:
      - $ref: '#/components/parameters/UserCsrf'
      - $ref: '#/components/parameters/UserOrigin'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      tags:
      - user-auth
      summary: 退出用户端会话
      responses:
        '200':
          description: 会话已撤销
          headers:
            Set-Cookie:
              description: HttpOnly、SameSite=Lax 的会话 Cookie；Web 登录/刷新/登出时设置或清除
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: 通常为 no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - userCookie: []
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/UserCsrf'
      - $ref: '#/components/parameters/UserOrigin'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
  /api/v1/auth/session:
    get:
      operationId: getUserAuthSession
      tags:
      - user-auth
      summary: 读取用户端当前认证会话
      responses:
        '200':
          description: 匿名或已认证会话状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /api/v1/me:
    get:
      operationId: getUserMe
      tags:
      - user-profile
      summary: 读取当前用户安全展示资料
      responses:
        '200':
          description: 用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - userCookie: []
      - userBearer: []
  /api/v1/me/sessions:
    get:
      operationId: listUserSessions
      tags:
      - user-profile
      summary: 列出当前用户的在用会话
      responses:
        '200':
          description: 会话列表（最多 50 条）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - userCookie: []
      - userBearer: []
  /api/v1/me/sessions/{id}:
    delete:
      operationId: revokeUserSession
      tags:
      - user-profile
      summary: 撤销当前用户的一个会话
      responses:
        '200':
          description: 会话已撤销
          headers:
            Set-Cookie:
              description: HttpOnly、SameSite=Lax 的会话 Cookie；Web 登录/刷新/登出时设置或清除
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: 通常为 no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - userCookie: []
      - userBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/UserCsrf'
      - $ref: '#/components/parameters/UserOrigin'
  /api/v1/me/preferences:
    get:
      operationId: getUserPreferences
      tags:
      - user-profile
      summary: 读取用户外观与通知偏好
      responses:
        '200':
          description: 偏好与 ETag
          headers:
            ETag:
              description: 资源版本 ETag，格式为双引号包围的 vN
              schema:
                type: string
                pattern: ^"v[0-9]+"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - userCookie: []
      - userBearer: []
    patch:
      operationId: patchUserPreferences
      tags:
      - user-profile
      summary: 更新用户外观与通知偏好
      responses:
        '200':
          description: 更新后的偏好与新的 ETag
          headers:
            ETag:
              description: 资源版本 ETag，格式为双引号包围的 vN
              schema:
                type: string
                pattern: ^"v[0-9]+"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/VersionConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - userCookie: []
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/UserCsrf'
      - $ref: '#/components/parameters/UserOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesPatch'
  /admin/api/v1/auth/login:
    post:
      operationId: loginAdmin
      tags:
      - admin-auth
      summary: 管理员密码 + TOTP 登录
      responses:
        '200':
          description: 管理员会话已建立
          headers:
            Set-Cookie:
              description: HttpOnly、SameSite=Lax 的会话 Cookie；Web 登录/刷新/登出时设置或清除
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: 通常为 no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      parameters:
      - $ref: '#/components/parameters/AdminLoginOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
  /admin/api/v1/auth/step-up:
    post:
      operationId: stepUpAdmin
      tags:
      - admin-auth
      summary: 在现有管理员会话上完成新鲜验证
      responses:
        '200':
          description: 新鲜验证已提升
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - adminCookie: []
      parameters:
      - $ref: '#/components/parameters/AdminCsrf'
      - $ref: '#/components/parameters/AdminOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
  /admin/api/v1/auth/logout:
    post:
      operationId: logoutAdmin
      tags:
      - admin-auth
      summary: 退出管理员会话
      responses:
        '200':
          description: 会话已撤销
          headers:
            Set-Cookie:
              description: HttpOnly、SameSite=Lax 的会话 Cookie；Web 登录/刷新/登出时设置或清除
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: 通常为 no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - adminCookie: []
      parameters:
      - $ref: '#/components/parameters/AdminCsrf'
      - $ref: '#/components/parameters/AdminOrigin'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
  /admin/api/v1/auth/session:
    get:
      operationId: getAdminAuthSession
      tags:
      - admin-auth
      summary: 读取管理员当前认证会话
      responses:
        '200':
          description: 匿名或已认证管理员会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /admin/api/v1/me:
    get:
      operationId: getAdminMe
      tags:
      - admin-profile
      summary: 读取当前管理员资料
      responses:
        '200':
          description: 管理员资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - adminCookie: []
  /admin/api/v1/me/sessions:
    get:
      operationId: listAdminSessions
      tags:
      - admin-profile
      summary: 列出当前管理员的在用会话
      responses:
        '200':
          description: 会话列表（最多 50 条）
          content:
            application/json:
