      - generated_at
      - user_id
      description: 隐私导出包的区块来自服务端实际导出器；不包含密码、Cookie、会话令牌或支付密钥。
    CreateExportRequest:
      type: object
      properties:
        format:
          type: string
          enum:
          - json
      additionalProperties: false
      description: 请求体可为空对象；当前只支持 JSON 导出。
    CreateExportResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
      additionalProperties: false
      required:
      - id
      - status
    CreateDeletionRequest:
      type: object
      properties:
        confirm:
          type: boolean
          description: 必须为 true，表示停止安排并申请删除
      additionalProperties: false
      required:
      - confirm
    CreateDeletionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - needs_review
        sessions_revoked:
          type: boolean
        message:
          type: string
      additionalProperties: false
      required:
      - id
      - status
      - sessions_revoked
      - message
    ZpayNotification:
      type: object
      properties:
        pid:
          type: string
          description: ZPay 商户 ID
        trade_no:
          type: string
          description: ZPay 交易号
        out_trade_no:
          type: string
          description: 商户订单号
        type:
          type: string
          enum:
          - alipay
          - wxpay
        name:
          type: string
          description: 商品名称
        money:
          type: string
          description: 支付金额，十进制字符串
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
        trade_status:
          type: string
          enum:
          - TRADE_SUCCESS
          - TRADE_CLOSED
        sign:
          type: string
          description: ZPay 异步通知签名
        sign_type:
          type: string
          enum:
          - MD5
      additionalProperties: false
      required:
      - pid
      - trade_no
      - out_trade_no
      - type
      - money
      - trade_status
      - sign
