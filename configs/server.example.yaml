mode: production

server:
  user_listen: "127.0.0.1:8090"
  admin_listen: "127.0.0.1:8091"
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 1m
  shutdown_timeout: 10s
  # 服务只监听回环地址，公开入口是同机反向代理或本机隧道。这里只信任回环来源
  # 转发的一层 X-Forwarded-For；其他来源不会被当作真实客户端地址。
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"

database:
  # 相对路径以本配置文件所在目录为基准；文件必须仅服务用户可读。
  dsn_file: "secrets/database.dsn"
  max_connections: 12
  connect_timeout: 5s
  query_timeout: 3s

log:
  level: info

auth:
  enabled: true
  encryption_key_file: "secrets/application-v1.key"
  encryption_key_version: 1
  identity_key_file: "secrets/identity.key"
  cookie_secure: true
  # 下面两个域名只是占位，必须替换成自己的两个不同 HTTPS 域名。
  user_origin: "https://learn.example.com"
  admin_origin: "https://admin.example.com"
  session_ttl: 12h

storage:
  # 默认安装布局下，/etc/byebyeocs/../../ 指到根目录。
  data_dir: "../../var/lib/byebyeocs"
  admin_assets_dir: "../../opt/byebyeocs/current/apps/admin"
  client_assets_dir: "../../opt/byebyeocs/current/apps/client-web"

learning:
  enabled: false
  execution_enabled: false
  execution_evidence_reference: ""
  global_concurrency: 4
  account_concurrency: 1

payments:
  enabled: false
  charging_enabled: false
  merchant_id: ""
  key_file: ""
  # 支付回调的内部路由是 /payments/callbacks/zpay，只注册在管理员监听上。
  # 按实际公网代理拓扑填写 notify_url，确保渠道 POST 最终到达该内部路由：
  # https://admin.example.com/payments/callbacks/zpay
  notify_url: ""
  return_url: ""

questions:
  enabled: false
  # 默认按用户隔离题库缓存；仅在确认共享范围后开启。是否真正命中共享缓存
  # 还取决于题库服务自身的共享缓存开关。
  allow_shared_cache: false
  url: ""
  token_file: ""
  timeout: 95s
  concurrency: 2

operations:
  disk_protection: true
  retention_interval: 24h
  export_max_bytes: 8388608
  max_event_streams: 64
  require_fresh_backup: true
  backup_status_file: "secrets/backup-status.json"
  backup_max_age: 15m
