# 管理员 HTTPS 反向代理示例（Nginx）。必须使用独立管理员域名和证书。
# 不要把管理员入口直接暴露给公网；在此 server 块内追加 VPN、mTLS 或明确的 IP allowlist。

server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;

    # 示例：只允许受控网络访问，实际地址按自己的网络替换后取消注释。
    # 启用 ZPay 时不要挡住下方的支付回调 location。
    # allow 203.0.113.0/24;
    # deny all;

    # ZPay 回调的内部路由只注册在管理员监听上。启用支付时保留这个精确 location，
    # 它不受上面管理员入口 allowlist 的限制；未启用支付可删除。公开 notify_url 的
    # 主机或路径与本示例不同时，由实际代理把渠道请求转发到这个内部路径。
    location = /payments/callbacks/zpay {
        allow all;
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /admin/api/v1/events {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
