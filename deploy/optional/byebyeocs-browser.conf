# 可选浏览器执行 drop-in 示例，仅在部署方确认使用受支持 Chrome 时启用。
# 主单元默认不安装浏览器、不启用执行；普通安装不需要这个文件。
#
# 用法（确认已安装受支持 Chrome，并设置 learning.execution_enabled 与
# learning.browser_executable 后）：
#   install -d /etc/systemd/system/byebyeocs.service.d
#   install -m 0644 deploy/optional/byebyeocs-browser.conf \
#     /etc/systemd/system/byebyeocs.service.d/browser.conf
#   systemctl daemon-reload
#
# 浏览器需要可执行的临时目录和 JIT；这会降低部分系统调用/内存写执行保护。
# 不支持 Chromium 之外的浏览器，也不把 Chrome 作为基础运行前提。
[Service]
PrivateTmp=false
NoNewPrivileges=false
MemoryDenyWriteExecute=false
